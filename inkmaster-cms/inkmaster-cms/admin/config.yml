backend:
  name: github
  repo: ohakem685-lang/inkmaster
  branch: main
media_folder: img
public_folder: img
collections:
  - name: site
    label: محتوى الموقع
    files:
      - name: texts
        label: النصوص (عربي + English)
        file: content/texts.json
        fields:
          - label: النصوص
            name: texts
            widget: list
            allow_add: false
            summary: "{{fields.page}} · {{fields.ar}}"
            fields:
              - {label: id, name: id, widget: hidden}
              - {label: الصفحة, name: page, widget: hidden}
              - {label: النص بالعربي, name: ar, widget: text}
              - {label: English text, name: en, widget: text, required: false}
      - name: images
        label: الصور
        file: content/images.json
        fields:
          - label: الصور
            name: images
            widget: list
            allow_add: false
            summary: "{{fields.label}}"
            fields:
              - {label: id, name: id, widget: hidden}
              - {label: الوصف, name: label, widget: hidden}
              - {label: الصورة, name: src, widget: image, choose_url: false}
